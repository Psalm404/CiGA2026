<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help AI Anchorman 后台</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --panel: #ffffff;
      --text: #141922;
      --muted: #637083;
      --line: #d8dee8;
      --accent: #00a870;
      --ink: #101216;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f8fafc, var(--bg));
    }

    .shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }

    h2 {
      margin: 0;
      font-size: 18px;
    }

    .sub {
      margin: 7px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 14px 42px rgba(20, 25, 34, 0.08);
    }

    .form {
      display: grid;
      gap: 18px;
      padding: 18px;
    }

    .section {
      display: grid;
      gap: 14px;
      padding-top: 4px;
    }

    .component-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .component {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
    }

    .group {
      display: grid;
      gap: 9px;
    }

    label {
      font-weight: 700;
    }

    .row-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    input[type="range"] {
      width: 100%;
    }

    input[type="color"] {
      width: 52px;
      height: 36px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    textarea,
    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: #fff;
      font: inherit;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
      padding: 12px;
      line-height: 1.65;
    }

    input[type="number"] {
      padding: 9px 10px;
    }

    .inline {
      display: grid;
      grid-template-columns: 1fr 92px;
      gap: 10px;
      align-items: center;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f9fbfd;
    }

    .switch-row input {
      width: 22px;
      height: 22px;
      accent-color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding-top: 4px;
    }

    button,
    a.button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 11px 14px;
      color: #fff;
      background: var(--accent);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button.secondary,
    a.secondary {
      color: var(--text);
      border-color: var(--line);
      background: #fff;
    }

    .preview {
      overflow: hidden;
      background: var(--ink);
      color: #f4f7fb;
    }

    .preview-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      background: #202631;
      font-size: 13px;
    }

    .preview-body {
      min-height: 250px;
      padding: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .toast {
      min-height: 24px;
      color: var(--accent);
      font-weight: 700;
    }

    @media (max-width: 960px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .layout,
      .component-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Help AI Anchorman 后台</h1>
        <p class="sub">调节首页元素、电视窗口、漫画图片和字幕框。所有设置会热更新到已打开的主页。</p>
      </div>
      <a class="button secondary" href="index.html" target="_blank" rel="noreferrer">打开主页面</a>
    </header>

    <div class="layout">
      <section class="panel form" aria-label="页面设置">
        <div class="section">
          <h2>页面组件</h2>
          <div class="component-grid" id="componentGrid"></div>
          <div class="hint">位置单位是电视内容区域的百分比。X 越大越靠右，Y 越大越靠下。电视窗口控制外框，漫画图片和字幕框都被限制在电视内部。</div>
        </div>

        <div class="section">
          <h2>标题样式</h2>
          <div class="component-grid">
            <div class="component">
              <div class="group">
                <label for="titleMainColor">普通字母颜色</label>
                <input id="titleMainColor" type="color">
              </div>
              <div class="group">
                <label for="titleAnchorColor">ANCHOR 颜色</label>
                <input id="titleAnchorColor" type="color">
              </div>
            </div>
            <div class="component">
              <div class="group">
                <label for="titleMotion">标题动效幅度：<span id="titleMotionValue">4</span> px</label>
                <div class="inline">
                  <input id="titleMotion" type="range" min="0" max="18" step="1">
                  <input id="titleMotionNumber" type="number" min="0" max="18" step="1">
                </div>
              </div>
              <div class="hint">设为 0 时标题完全静止。</div>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>漫画字幕</h2>
          <div class="group">
            <label for="comicText1">comic1 字幕</label>
            <textarea id="comicText1"></textarea>
          </div>
          <div class="group">
            <label for="comicText2">comic2 字幕</label>
            <textarea id="comicText2"></textarea>
          </div>
          <div class="group">
            <label for="comicText3">comic3 字幕</label>
            <textarea id="comicText3"></textarea>
          </div>
          <div class="group">
            <label for="comicText4">comic4 字幕</label>
            <textarea id="comicText4"></textarea>
          </div>

          <div class="group">
            <label for="speed">打字速度：<span id="speedValue">42</span> ms / 字</label>
            <div class="inline">
              <input id="speed" type="range" min="8" max="160" step="1">
              <input id="speedNumber" type="number" min="8" max="160" step="1">
            </div>
          </div>

          <div class="group">
            <label for="fontSize">字幕字号：<span id="fontSizeValue">24</span> px</label>
            <div class="inline">
              <input id="fontSize" type="range" min="16" max="44" step="1">
              <input id="fontSizeNumber" type="number" min="16" max="44" step="1">
            </div>
          </div>

          <div class="group">
            <label for="accent">光标颜色</label>
            <input id="accent" type="color">
          </div>

          <label class="switch-row" for="cursor">
            <span>
              <strong>显示打字光标</strong>
              <span class="hint">关闭后漫画字幕不会显示闪烁竖线。</span>
            </span>
            <input id="cursor" type="checkbox">
          </label>
        </div>

        <div class="actions">
          <button id="saveBtn" type="button">保存设置</button>
          <button id="resetBtn" class="secondary" type="button">恢复默认</button>
        </div>
        <div class="toast" id="toast" role="status"></div>
      </section>

      <aside class="panel preview" aria-label="字幕预览">
        <div class="preview-head">
          <strong>字幕预览</strong>
          <span id="previewMeta">42ms</span>
        </div>
        <div class="preview-body" id="previewBody"></div>
      </aside>
    </div>
  </main>

  <script>
    const defaultSettings = {
      speed: 42,
      fontSize: 24,
      cursor: true,
      accent: "#111827",
      titleMainColor: "#de8a3a",
      titleAnchorColor: "#4f8ec7",
      titleMotion: 4,
      comicTexts: [
        "“这简直是人工智障！”",
        "愚蠢的AI 播报员在新闻联播里经常会把事实说跑偏，让观众听得一头雾水。",
        "面对频繁出现的大模型幻觉问题，严谨的新闻事实校对员再也忍不下去了！",
        "把新闻里的错误一一纠正，还大家一档真实可靠、清清楚楚的新闻联播吧~"
      ],
      layout: {
        title: { x: 50, y: 15.2, scale: 1 },
        earth: { x: 50, y: 4.6, w: 50 },
        anchor: { x: 82, y: 100, w: 30 },
        button: { x: 50, y: 82, w: 25 },
        tv: { x: 50, y: 50, w: 82, h: 72 },
        comicFrame: { x: 50, y: 6, w: 72, h: 58 },
        comic1: { x: 50, y: 50, w: 88 },
        comic2: { x: 50, y: 50, w: 88 },
        comic3: { x: 50, y: 50, w: 88 },
        comic4: { x: 50, y: 50, w: 88 },
        caption: { x: 50, y: 72, w: 78, h: 22 }
      }
    };

    const configKey = "help-ai-anchorman-settings";
    const componentDefs = [
      { key: "title", name: "标题", sizeKey: "scale", sizeLabel: "缩放", min: 0.3, max: 2.8, step: 0.01 },
      { key: "earth", name: "地球", sizeKey: "w", sizeLabel: "宽度", min: 10, max: 180, step: 1 },
      { key: "anchor", name: "播报员", sizeKey: "w", sizeLabel: "宽度", min: 8, max: 140, step: 1 },
      { key: "button", name: "开始按钮", sizeKey: "w", sizeLabel: "宽度", min: 8, max: 100, step: 1 },
      { key: "tv", name: "电视窗口", sizes: [
        { key: "w", label: "宽度", min: 45, max: 98, step: 1 },
        { key: "h", label: "高度", min: 38, max: 92, step: 1 }
      ] },
      { key: "comicFrame", name: "漫画框", sizes: [
        { key: "w", label: "宽度", min: 24, max: 100, step: 1 },
        { key: "h", label: "高度", min: 18, max: 74, step: 1 }
      ] },
      { key: "comic1", name: "comic1 图片", sizeKey: "w", sizeLabel: "宽度", min: 18, max: 160, step: 1 },
      { key: "comic2", name: "comic2 图片", sizeKey: "w", sizeLabel: "宽度", min: 18, max: 160, step: 1 },
      { key: "comic3", name: "comic3 图片", sizeKey: "w", sizeLabel: "宽度", min: 18, max: 160, step: 1 },
      { key: "comic4", name: "comic4 图片", sizeKey: "w", sizeLabel: "宽度", min: 18, max: 160, step: 1 },
      { key: "caption", name: "字幕框", sizes: [
        { key: "w", label: "宽度", min: 20, max: 100, step: 1 },
        { key: "h", label: "高度", min: 10, max: 46, step: 1 }
      ] }
    ];

    const fields = {
      speed: document.getElementById("speed"),
      speedNumber: document.getElementById("speedNumber"),
      fontSize: document.getElementById("fontSize"),
      fontSizeNumber: document.getElementById("fontSizeNumber"),
      accent: document.getElementById("accent"),
      cursor: document.getElementById("cursor"),
      titleMainColor: document.getElementById("titleMainColor"),
      titleAnchorColor: document.getElementById("titleAnchorColor"),
      titleMotion: document.getElementById("titleMotion"),
      titleMotionNumber: document.getElementById("titleMotionNumber"),
      comicTexts: [
        document.getElementById("comicText1"),
        document.getElementById("comicText2"),
        document.getElementById("comicText3"),
        document.getElementById("comicText4")
      ]
    };
    const speedValue = document.getElementById("speedValue");
    const fontSizeValue = document.getElementById("fontSizeValue");
    const previewBody = document.getElementById("previewBody");
    const previewMeta = document.getElementById("previewMeta");
    const titleMotionValue = document.getElementById("titleMotionValue");
    const toast = document.getElementById("toast");
    const componentGrid = document.getElementById("componentGrid");
    const configChannel = "BroadcastChannel" in window ? new BroadcastChannel("help-ai-anchorman") : null;
    const layoutInputs = {};
    let hotUpdateTimer = null;

    function mergeSettings(saved) {
      return {
        ...defaultSettings,
        ...saved,
        comicTexts: Array.from({ length: 4 }, (_, index) => {
          return saved && saved.comicTexts && saved.comicTexts[index] !== undefined ? saved.comicTexts[index] : defaultSettings.comicTexts[index];
        }),
        layout: {
          title: { ...defaultSettings.layout.title, ...(saved && saved.layout && saved.layout.title) },
          earth: { ...defaultSettings.layout.earth, ...(saved && saved.layout && saved.layout.earth) },
          anchor: { ...defaultSettings.layout.anchor, ...(saved && saved.layout && saved.layout.anchor) },
          button: { ...defaultSettings.layout.button, ...(saved && saved.layout && saved.layout.button) },
          tv: { ...defaultSettings.layout.tv, ...(saved && saved.layout && saved.layout.tv) },
          comicFrame: { ...defaultSettings.layout.comicFrame, ...(saved && saved.layout && saved.layout.comicFrame) },
          comic1: { ...defaultSettings.layout.comic1, ...(saved && saved.layout && (saved.layout.comic1 || saved.layout.comics && saved.layout.comics[0])) },
          comic2: { ...defaultSettings.layout.comic2, ...(saved && saved.layout && (saved.layout.comic2 || saved.layout.comics && saved.layout.comics[1])) },
          comic3: { ...defaultSettings.layout.comic3, ...(saved && saved.layout && (saved.layout.comic3 || saved.layout.comics && saved.layout.comics[2])) },
          comic4: { ...defaultSettings.layout.comic4, ...(saved && saved.layout && (saved.layout.comic4 || saved.layout.comics && saved.layout.comics[3])) },
          caption: { ...defaultSettings.layout.caption, ...(saved && saved.layout && saved.layout.caption) }
        }
      };
    }

    function loadSettings() {
      try {
        return mergeSettings(JSON.parse(localStorage.getItem(configKey)));
      } catch (error) {
        return mergeSettings(null);
      }
    }

    function controlHtml(component, prop, label, min, max, step) {
      const id = `${component}-${prop}`;
      return `
        <div class="group">
          <div class="row-label"><span>${label}</span><span id="${id}-value"></span></div>
          <div class="inline">
            <input id="${id}" data-component="${component}" data-prop="${prop}" type="range" min="${min}" max="${max}" step="${step}">
            <input id="${id}-number" data-component="${component}" data-prop="${prop}" type="number" min="${min}" max="${max}" step="${step}">
          </div>
        </div>
      `;
    }

    function getSizeDefs(def) {
      if (def.sizes) return def.sizes;
      return [{ key: def.sizeKey, label: def.sizeLabel, min: def.min, max: def.max, step: def.step }];
    }

    function buildLayoutControls() {
      componentGrid.innerHTML = componentDefs.map((def) => `
        <div class="component">
          <h2>${def.name}</h2>
          ${controlHtml(def.key, "x", "X 位置", 0, 100, 0.5)}
          ${controlHtml(def.key, "y", "Y 位置", 0, 110, 0.5)}
          ${getSizeDefs(def).map((size) => controlHtml(def.key, size.key, size.label, size.min, size.max, size.step)).join("")}
        </div>
      `).join("");

      componentDefs.forEach((def) => {
        ["x", "y", ...getSizeDefs(def).map((size) => size.key)].forEach((prop) => {
          const id = `${def.key}-${prop}`;
          layoutInputs[id] = {
            range: document.getElementById(id),
            number: document.getElementById(`${id}-number`),
            value: document.getElementById(`${id}-value`)
          };
          [layoutInputs[id].range, layoutInputs[id].number].forEach((input) => {
            input.addEventListener("input", () => {
              const peer = input === layoutInputs[id].range ? layoutInputs[id].number : layoutInputs[id].range;
              peer.value = input.value;
              updateAndPublish();
            });
          });
        });
      });
    }

    function readLayout() {
      const layout = {};
      componentDefs.forEach((def) => {
        layout[def.key] = {
          x: Number(layoutInputs[`${def.key}-x`].range.value),
          y: Number(layoutInputs[`${def.key}-y`].range.value)
        };
        getSizeDefs(def).forEach((size) => {
          layout[def.key][size.key] = Number(layoutInputs[`${def.key}-${size.key}`].range.value);
        });
      });
      return layout;
    }

    function readForm() {
      return {
        speed: Number(fields.speed.value),
        fontSize: Number(fields.fontSize.value),
        cursor: fields.cursor.checked,
        accent: fields.accent.value,
        titleMainColor: fields.titleMainColor.value,
        titleAnchorColor: fields.titleAnchorColor.value,
        titleMotion: Number(fields.titleMotion.value),
        comicTexts: fields.comicTexts.map((field) => field.value),
        layout: readLayout()
      };
    }

    function writeLayout(settings) {
      componentDefs.forEach((def) => {
        const values = settings.layout[def.key];
        ["x", "y", ...getSizeDefs(def).map((size) => size.key)].forEach((prop) => {
          const id = `${def.key}-${prop}`;
          layoutInputs[id].range.value = values[prop];
          layoutInputs[id].number.value = values[prop];
          layoutInputs[id].value.textContent = prop === "scale" ? values[prop].toFixed(2) : `${values[prop]}%`;
        });
      });
    }

    function writeForm(settings) {
      fields.speed.value = settings.speed;
      fields.speedNumber.value = settings.speed;
      fields.fontSize.value = settings.fontSize;
      fields.fontSizeNumber.value = settings.fontSize;
      fields.accent.value = settings.accent;
      fields.cursor.checked = settings.cursor;
      fields.titleMainColor.value = settings.titleMainColor;
      fields.titleAnchorColor.value = settings.titleAnchorColor;
      fields.titleMotion.value = settings.titleMotion;
      fields.titleMotionNumber.value = settings.titleMotion;
      fields.comicTexts.forEach((field, index) => {
        field.value = settings.comicTexts[index];
      });
      writeLayout(settings);
      renderPreview();
    }

    function renderPreview() {
      const settings = readForm();
      speedValue.textContent = settings.speed;
      fontSizeValue.textContent = settings.fontSize;
      titleMotionValue.textContent = settings.titleMotion;
      previewMeta.textContent = `${settings.speed}ms`;
      previewBody.textContent = settings.comicTexts.map((text, index) => `comic${index + 1}: ${text}`).join("\n\n");
      previewBody.style.fontSize = `${settings.fontSize}px`;
      document.documentElement.style.setProperty("--accent", settings.accent);
      writeLayout(settings);
    }

    function publishSettings(showSavedMessage = false) {
      localStorage.setItem(configKey, JSON.stringify(readForm()));
      if (configChannel) configChannel.postMessage("settings-updated");
      if (showSavedMessage) {
        toast.textContent = "已保存，主页面会同步读取新设置。";
        setTimeout(() => {
          toast.textContent = "";
        }, 2200);
      }
    }

    function hotUpdate() {
      clearTimeout(hotUpdateTimer);
      hotUpdateTimer = setTimeout(() => {
        publishSettings(false);
      }, 40);
    }

    function updateAndPublish() {
      renderPreview();
      hotUpdate();
    }

    function syncPair(source, target) {
      target.value = source.value;
      updateAndPublish();
    }

    buildLayoutControls();
    fields.speed.addEventListener("input", () => syncPair(fields.speed, fields.speedNumber));
    fields.speedNumber.addEventListener("input", () => syncPair(fields.speedNumber, fields.speed));
    fields.fontSize.addEventListener("input", () => syncPair(fields.fontSize, fields.fontSizeNumber));
    fields.fontSizeNumber.addEventListener("input", () => syncPair(fields.fontSizeNumber, fields.fontSize));
    fields.titleMotion.addEventListener("input", () => syncPair(fields.titleMotion, fields.titleMotionNumber));
    fields.titleMotionNumber.addEventListener("input", () => syncPair(fields.titleMotionNumber, fields.titleMotion));
    [fields.accent, fields.cursor, fields.titleMainColor, fields.titleAnchorColor, ...fields.comicTexts].forEach((field) => {
      field.addEventListener("input", updateAndPublish);
      field.addEventListener("change", updateAndPublish);
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
      publishSettings(true);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      localStorage.removeItem(configKey);
      writeForm(defaultSettings);
      if (configChannel) configChannel.postMessage("settings-updated");
      toast.textContent = "已恢复默认设置。";
      setTimeout(() => {
        toast.textContent = "";
      }, 2200);
    });

    writeForm(loadSettings());
  </script>
</body>
</html>
