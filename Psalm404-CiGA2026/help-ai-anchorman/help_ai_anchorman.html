<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>help_ai_anchorman</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

.game-shell-actions {
	position: fixed;
	top: max(12px, env(safe-area-inset-top));
	right: max(12px, env(safe-area-inset-right));
	z-index: 20;
	display: flex;
	gap: 8px;
	align-items: center;
	font-family: ui-rounded, "Arial Rounded MT Bold", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
}

.game-shell-button {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	min-height: 38px;
	border: 3px solid #ffffff;
	border-radius: 8px;
	padding: 8px 12px;
	color: #102e44;
	background:
		radial-gradient(circle at 14% 18%, rgba(255, 255, 255, 0.78), transparent 18%),
		linear-gradient(145deg, #34d8ff, #76f4cf 58%, #fff2ae);
	box-shadow:
		0 0 0 2px #102e44,
		0 5px 0 #102e44,
		0 14px 24px rgba(6, 22, 38, 0.28);
	cursor: pointer;
	font: inherit;
	font-size: 14px;
	font-weight: 950;
	line-height: 1;
	text-decoration: none;
	text-shadow: 0 1px 0 rgba(255, 255, 255, 0.56);
	transform: rotate(1deg);
	transition:
		filter 160ms ease,
		transform 180ms cubic-bezier(0.2, 0.9, 0.2, 1.4);
}

.game-shell-button:hover,
.game-shell-button:focus-visible {
	filter: brightness(1.08);
	outline: none;
	transform: translateY(-5px) rotate(-1.5deg) scale(1.03);
}

.game-shell-button.is-restart {
	background:
		radial-gradient(circle at 14% 18%, rgba(255, 255, 255, 0.78), transparent 18%),
		linear-gradient(145deg, #ffd45c, #ff9e57 56%, #ff4f78);
}

@media (max-width: 640px) {
	.game-shell-actions {
		top: max(10px, env(safe-area-inset-top));
		right: max(10px, env(safe-area-inset-right));
		gap: 6px;
	}

	.game-shell-button {
		min-height: 34px;
		padding: 7px 9px;
		font-size: 12px;
	}
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="help_ai_anchorman.icon.png" />
<link rel="apple-touch-icon" href="help_ai_anchorman.apple-touch-icon.png"/>

	</head>
	<body>
		<div class="game-shell-actions" aria-label="game actions">
			<a class="game-shell-button" href="../../index.html">返回序号选择</a>
			<button class="game-shell-button is-restart" id="restartGame" type="button">重新开始</button>
		</div>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="help_ai_anchorman.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="help_ai_anchorman.js"></script>
		<script>
document.getElementById('restartGame')?.addEventListener('click', () => {
	window.location.reload();
});
		</script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"help_ai_anchorman","experimentalVK":false,"fileSizes":{"help_ai_anchorman.pck":31767976,"help_ai_anchorman.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
