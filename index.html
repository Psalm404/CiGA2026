<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anchor Plus+</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./anchor-plus3.css" />
  </head>
  <body>
    <main class="start-shell" aria-label="Anchor Plus Plus start page">
      <section class="stage" aria-label="Anchor Plus Plus mini game menu">
        <img
          class="stage-bg"
          src="./assets/anchor-plus3/background.png"
          alt=""
          aria-hidden="true"
        />

        <h1 class="brand-title" aria-label="anchor plus plus">
          <span style="--i: 0">a</span><span style="--i: 1">n</span
          ><span style="--i: 2">c</span><span style="--i: 3">h</span
          ><span style="--i: 4">o</span><span style="--i: 5">r</span
          ><span class="word-gap" style="--i: 6">p</span
          ><span style="--i: 7">l</span><span style="--i: 8">u</span
          ><span style="--i: 9">s</span><sup style="--i: 10">+</sup>
        </h1>

        <div class="entry-guide" aria-hidden="true">
          <span>点击序号<br />进入小游戏</span>
        </div>

        <svg class="guide-arrow" viewBox="0 0 100 100" aria-hidden="true">
          <path
            class="arrow-line"
            d="M 10 46 C 18 26, 32 22, 43 31 S 58 47, 70 36"
          />
          <path class="arrow-head" d="M 68 27 L 80 35 L 67 43" />
        </svg>

        <section class="maker-credit" aria-label="creators">
          <div class="maker-question">who make this?</div>
          <svg class="maker-arrows" viewBox="0 0 260 128" aria-hidden="true">
            <path class="maker-arrow maker-arrow-1" d="M 130 22 C 94 42, 74 64, 61 93" />
            <path class="maker-arrow maker-arrow-2" d="M 130 22 C 166 42, 186 64, 199 93" />
            <path class="maker-head maker-head-1" d="M 50 84 L 59 104 L 75 89" />
            <path class="maker-head maker-head-2" d="M 185 89 L 201 104 L 210 84" />
          </svg>
          <div class="maker-node maker-node-1">
            <span>五月</span>
          </div>
          <div class="maker-node maker-node-2">
            <span>翛代</span>
          </div>
        </section>

        <nav class="game-menu" aria-label="mini game entries">
          <div class="game-entry entry-1">
            <span class="meme-frame">
              <img src="./assets/anchor-plus3/meme-1.png" alt="" />
            </span>
            <a
              class="entry-number"
              href="./anchorshackeshacke-game1/index.html?v=anchor-plus-restart-1"
              aria-label="进入小游戏 1"
              aria-describedby="entry-caption-1"
              >1</a
            >
            <span id="entry-caption-1" class="entry-caption">恶搞-有人要吐了，，</span>
          </div>

          <div class="game-entry entry-2">
            <span class="meme-frame">
              <img src="./assets/anchor-plus3/meme-2.png" alt="" />
            </span>
            <a
              class="entry-number"
              href="./Psalm404-CiGA2026/help-ai-anchorman/help_ai_anchorman.html"
              aria-label="进入小游戏 2"
              aria-describedby="entry-caption-2"
              >2</a
            >
            <span id="entry-caption-2" class="entry-caption"
              >休闲解密-ai man help ai anchorman!</span
            >
          </div>

          <div class="game-entry entry-3">
            <span class="meme-frame">
              <img src="./assets/anchor-plus3/meme-3.png" alt="" />
            </span>
            <a
              class="entry-number"
              href="./game3/index.html"
              aria-label="进入小游戏 3"
              aria-describedby="entry-caption-3"
              >3</a
            >
            <span id="entry-caption-3" class="entry-caption">跑酷-梅人说不能做跑酷</span>
          </div>
        </nav>
      </section>
    </main>
  </body>
</html>
